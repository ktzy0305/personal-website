<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="620" fill="#0F1117" rx="16"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">NEW WORKFLOW — Edit from Template</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#6B7280">After February 4, 2026 · editing.md</text>

  <!-- Step 1: Analyze -->
  <rect x="300" y="84" width="300" height="56" rx="8" fill="#1C2133" stroke="#6366F1" stroke-width="1.5"/>
  <text x="450" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1 · Analyze Template</text>
  <text x="450" y="125" text-anchor="middle" font-size="11" fill="#A5B4FC">thumbnail.py · markitdown</text>

  <!-- Arrow -->
  <line x1="450" y1="140" x2="450" y2="158" stroke="#374151" stroke-width="2"/>
  <polygon points="450,164 444,154 456,154" fill="#374151"/>

  <!-- Step 2: Plan -->
  <rect x="270" y="166" width="360" height="56" rx="8" fill="#1C2133" stroke="#6366F1" stroke-width="1.5"/>
  <text x="450" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2 · Plan Slide Mapping</text>
  <text x="450" y="207" text-anchor="middle" font-size="11" fill="#A5B4FC">Choose layouts · vary design · avoid monotony</text>

  <!-- Arrow -->
  <line x1="450" y1="222" x2="450" y2="240" stroke="#374151" stroke-width="2"/>
  <polygon points="450,246 444,236 456,236" fill="#374151"/>

  <!-- Step 3: Unpack -->
  <rect x="300" y="248" width="300" height="56" rx="8" fill="#1C2133" stroke="#6366F1" stroke-width="1.5"/>
  <text x="450" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3 · Unpack</text>
  <text x="450" y="289" text-anchor="middle" font-size="11" fill="#A5B4FC">template.pptx → unpacked/ XML files</text>

  <!-- Arrow -->
  <line x1="450" y1="304" x2="450" y2="322" stroke="#374151" stroke-width="2"/>
  <polygon points="450,328 444,318 456,318" fill="#374151"/>

  <!-- Step 4: Restructure - highlighted as agent-only -->
  <rect x="265" y="330" width="370" height="62" rx="8" fill="#1F1A10" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4 · Restructure  <tspan font-size="10" fill="#FCD34D">— agent only, no subagents</tspan></text>
  <text x="450" y="371" text-anchor="middle" font-size="11" fill="#FDE68A">Delete · duplicate · reorder slides in XML</text>
  <text x="450" y="385" text-anchor="middle" font-size="10" fill="#F59E0B">Must complete before Step 5</text>

  <!-- Arrow splits -->
  <line x1="450" y1="392" x2="450" y2="412" stroke="#374151" stroke-width="2"/>
  <polygon points="450,418 444,408 456,408" fill="#374151"/>

  <!-- Step 5: Edit content - parallel -->
  <rect x="190" y="420" width="520" height="70" rx="8" fill="#0F2818" stroke="#16A34A" stroke-width="1.5"/>
  <text x="450" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5 · Edit Content  <tspan font-size="10" fill="#4ADE80">— subagents can work in parallel</tspan></text>

  <!-- Parallel slide boxes -->
  <rect x="210" y="453" width="130" height="28" rx="5" fill="#1A3A24" stroke="#22C55E" stroke-width="1"/>
  <text x="275" y="471" text-anchor="middle" font-size="10" fill="#86EFAC">slide1.xml</text>

  <rect x="385" y="453" width="130" height="28" rx="5" fill="#1A3A24" stroke="#22C55E" stroke-width="1"/>
  <text x="450" y="471" text-anchor="middle" font-size="10" fill="#86EFAC">slide2.xml</text>

  <rect x="560" y="453" width="130" height="28" rx="5" fill="#1A3A24" stroke="#22C55E" stroke-width="1"/>
  <text x="625" y="471" text-anchor="middle" font-size="10" fill="#86EFAC">slide3.xml</text>

  <!-- Arrows from parallel boxes converge -->
  <line x1="275" y1="490" x2="275" y2="512" stroke="#374151" stroke-width="1.5"/>
  <line x1="450" y1="490" x2="450" y2="512" stroke="#374151" stroke-width="1.5"/>
  <line x1="625" y1="490" x2="625" y2="512" stroke="#374151" stroke-width="1.5"/>
  <line x1="275" y1="512" x2="625" y2="512" stroke="#374151" stroke-width="1.5"/>
  <line x1="450" y1="512" x2="450" y2="526" stroke="#374151" stroke-width="1.5"/>
  <polygon points="450,532 444,522 456,522" fill="#374151"/>

  <!-- Step 6: Clean -->
  <rect x="320" y="534" width="260" height="44" rx="8" fill="#1C2133" stroke="#6366F1" stroke-width="1.5"/>
  <text x="450" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">6 · Clean</text>
  <text x="450" y="569" text-anchor="middle" font-size="11" fill="#A5B4FC">Remove orphaned files · clean refs</text>

  <!-- Arrow -->
  <line x1="450" y1="578" x2="450" y2="590" stroke="#374151" stroke-width="2"/>
  <polygon points="450,596 444,586 456,586" fill="#374151"/>

  <!-- Step 7: Pack -->
  <rect x="320" y="598" width="260" height="10" rx="0" fill="none"/>
  <rect x="300" y="596" width="300" height="10" rx="0" fill="none"/>

  <!-- Final output -->
  <rect x="320" y="596" width="260" height="12" rx="0" fill="none"/>

  <rect x="320" y="592" width="260" height="22" rx="8" fill="#1A2E1A" stroke="#22C55E" stroke-width="1.5"/>
  <text x="450" y="607" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">7 · Pack → output.pptx</text>
</svg>
