<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="520" fill="#0F1117" rx="16"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">NEW WORKFLOW — Create from Scratch</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#6B7280">After February 4, 2026</text>

  <!-- Node 1: Agent Prompt -->
  <rect x="340" y="88" width="220" height="52" rx="8" fill="#1E2761" stroke="#4A5FD4" stroke-width="1.5"/>
  <text x="450" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Agent Prompt</text>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#A5B4FC">"Create a presentation about X"</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="140" x2="450" y2="162" stroke="#374151" stroke-width="2"/>
  <polygon points="450,168 444,158 456,158" fill="#374151"/>

  <!-- Node 2: Generate JS -->
  <rect x="270" y="170" width="360" height="66" rx="8" fill="#1A2E1A" stroke="#16A34A" stroke-width="1.5"/>
  <text x="450" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Agent Generates presentation.js</text>
  <text x="450" y="211" text-anchor="middle" font-size="11" fill="#86EFAC">pptxgenjs API calls in JavaScript</text>
  <text x="450" y="227" text-anchor="middle" font-size="10" fill="#4ADE80">shapes · text · images · tables · charts — in inches</text>

  <!-- No preview callout -->
  <rect x="650" y="178" width="176" height="42" rx="6" fill="#3B1515" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="738" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">✕  NO PREVIEW LAYER</text>
  <text x="738" y="212" text-anchor="middle" font-size="10" fill="#FCA5A5">Agent works blind until render</text>
  <line x1="650" y1="199" x2="630" y2="199" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Arrow 2 -->
  <line x1="450" y1="236" x2="450" y2="258" stroke="#374151" stroke-width="2"/>
  <polygon points="450,264 444,254 456,254" fill="#374151"/>

  <!-- Node 3: node execution -->
  <rect x="300" y="266" width="300" height="52" rx="8" fill="#1A2E1A" stroke="#16A34A" stroke-width="1.5"/>
  <text x="450" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">node presentation.js</text>
  <text x="450" y="307" text-anchor="middle" font-size="11" fill="#86EFAC">bash tool executes JavaScript via Node.js v22</text>

  <!-- Arrow 3 -->
  <line x1="450" y1="318" x2="450" y2="340" stroke="#374151" stroke-width="2"/>
  <polygon points="450,346 444,336 456,336" fill="#374151"/>

  <!-- Node 4: output.pptx -->
  <rect x="340" y="348" width="220" height="44" rx="8" fill="#1A2E1A" stroke="#22C55E" stroke-width="1.5"/>
  <text x="450" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">output.pptx</text>
  <text x="450" y="383" text-anchor="middle" font-size="10" fill="#86EFAC">Rendered presentation</text>

  <!-- Arrow 4 -->
  <line x1="450" y1="392" x2="450" y2="414" stroke="#374151" stroke-width="2"/>
  <polygon points="450,420 444,410 456,410" fill="#374151"/>

  <!-- Node 5: QA -->
  <rect x="245" y="422" width="410" height="66" rx="8" fill="#1C2133" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="450" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">⚠ Required QA Pass</text>
  <text x="450" y="463" text-anchor="middle" font-size="11" fill="#FCD34D">LibreOffice → PDF → pdftoppm → slide images</text>
  <text x="450" y="479" text-anchor="middle" font-size="10" fill="#FDE68A">Visual inspection · fix issues · re-verify until clean</text>

  <!-- Step labels -->
  <text x="240" y="120" text-anchor="middle" font-size="10" fill="#4B5563" font-weight="600">STEP 1</text>
  <text x="240" y="207" text-anchor="middle" font-size="10" fill="#4B5563" font-weight="600">STEP 2</text>
  <text x="240" y="296" text-anchor="middle" font-size="10" fill="#4B5563" font-weight="600">STEP 3</text>
  <text x="240" y="374" text-anchor="middle" font-size="10" fill="#4B5563" font-weight="600">STEP 4</text>
  <text x="240" y="459" text-anchor="middle" font-size="10" fill="#4B5563" font-weight="600">STEP 5</text>
</svg>
